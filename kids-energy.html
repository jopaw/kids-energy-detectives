<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vidyuth + Sam's Elephant Toothpaste Energy Detectives — A Raspberry Pi Kids Project</title>
<meta name="description" content="A fun, kid-friendly STEM project that turns a Raspberry Pi Zero 2 into an Energy Detective with a hands-on Peltier tile that turns warm fingers into electricity." />

<link rel="preconnect" href="https://unpkg.com" crossorigin />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<style>
  :root {
    --bg-1: #fff7d6;
    --bg-2: #ffe0f0;
    --bg-3: #d6f0ff;
    --ink:  #1c2541;
    --ink-soft: #4a5779;
    --heat: #ff6b6b;
    --card-shadow: 0 12px 30px rgba(28,37,65,0.12);
    --radius-lg: 22px;
    --radius-md: 14px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 10%, var(--bg-1) 0, transparent 40%),
      radial-gradient(circle at 90% 20%, var(--bg-2) 0, transparent 45%),
      radial-gradient(circle at 50% 90%, var(--bg-3) 0, transparent 50%),
      #fffefb;
    min-height: 100vh;
    line-height: 1.55;
    font-size: 17px;
  }

  /* Accessibility: visible focus rings on every interactive element */
  :where(a, button, summary, [tabindex]):focus-visible {
    outline: 3px solid #ff6b6b;
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* Accessibility: skip-to-main link, only visible on focus */
  .skip-link {
    position: absolute;
    left: 12px;
    top: -100px;
    background: #1c2541;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    z-index: 999;
    transition: top .15s;
  }
  .skip-link:focus { top: 12px; }

  /* Accessibility: respect "reduce motion" — kill animations for users who ask */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 22px 80px; }

  header.hero {
    text-align: center;
    padding: 30px 16px 10px;
  }
  header.hero h1 {
    /* Long title — keep it on a single line at every viewport size by
       scaling purely with viewport width (no min floor that would force
       a wrap on phones), capped at 2rem so it doesn't get huge on ultra-
       wide monitors. */
    font-size: min(2.2vw, 2rem);
    margin: 0 0 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: linear-gradient(90deg, #ff6b6b, #ffb703, #06d6a0, #4cc9f0, #b5179e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 0 rgba(255,255,255,0.5);
  }
  header.hero p.sub {
    font-size: clamp(1rem, 2vw, 1.25rem);
    color: var(--ink-soft);
    max-width: 720px;
    margin: 6px auto 0;
  }
  .badges { margin-top: 14px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .badge {
    background: white;
    border: 2px dashed #ffb703;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.95rem;
    box-shadow: var(--card-shadow);
  }

  .credit-row {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }
  .credit-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    color: var(--ink);
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    border: 2px solid rgba(28,37,65,0.1);
    box-shadow: var(--card-shadow);
    transition: transform .1s, border-color .15s, box-shadow .15s;
  }
  .credit-pill:hover {
    transform: translateY(-1px);
    border-color: #ffb703;
    box-shadow: 0 6px 14px rgba(28,37,65,0.14);
  }
  .credit-pill svg { display: block; }

  /* Tabs */
  html { scroll-behavior: smooth; }
  section[id] { scroll-margin-top: 80px; }

  .sticky-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 10px 8px;
    background: rgba(255, 254, 251, 0.92);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-bottom: 2px solid rgba(28, 37, 65, 0.08);
    margin: 8px -8px 16px;
  }
  .sticky-nav a {
    text-decoration: none;
    color: var(--ink);
    font-weight: bold;
    font-size: 0.95rem;
    padding: 8px 14px;
    border-radius: 999px;
    background: white;
    border: 2px solid transparent;
    box-shadow: 0 2px 6px rgba(28,37,65,0.08);
    transition: transform .1s, border-color .15s;
  }
  .sticky-nav a:hover { transform: translateY(-1px); border-color: #ffb703; }

  /* For-builders collapsible */
  details.build-details > summary {
    cursor: pointer;
    list-style: none;
    background: #fff;
    padding: 18px 22px;
    border-radius: var(--radius-lg);
    box-shadow: var(--card-shadow);
    font-size: 1.15rem;
    font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }
  details.build-details > summary::-webkit-details-marker { display: none; }
  details.build-details > summary::after {
    content: '▸';
    margin-left: auto;
    transition: transform .2s;
    color: var(--ink-soft);
  }
  details.build-details[open] > summary::after { transform: rotate(90deg); }
  details.build-details[open] > summary { margin-bottom: 0; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
  details.build-details > .build-body {
    background: #fff;
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    box-shadow: var(--card-shadow);
    padding: 0 22px 22px;
    margin-top: -4px;
  }

  /* Cards / sections */
  .card {
    background: white;
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: var(--card-shadow);
    margin-bottom: 22px;
  }
  h2 { margin: 0 0 10px; font-size: 1.6rem; }
  h3 { margin: 12px 0 8px; }

  /* Experiment hero — the headline elephant-toothpaste card */
  .experiment-hero {
    background: linear-gradient(160deg, #ffe9eb 0%, #ffd6d6 55%, #ffc4c8 100%);
    border-radius: var(--radius-lg);
    padding: 26px;
    box-shadow: var(--card-shadow);
    margin-bottom: 22px;
    border: 4px solid #fff;
  }
  .experiment-hero > h2 {
    margin: 0 0 6px;
    font-size: clamp(1.5rem, 3.6vw, 2.1rem);
    color: #1c2541;
  }
  .experiment-hero .lede {
    margin: 0 0 18px;
    font-size: 1.05rem;
    color: var(--ink-soft);
    max-width: 56ch;
  }
  .experiment-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    gap: 22px;
    align-items: stretch;
  }
  @media (max-width: 760px) {
    .experiment-grid { grid-template-columns: 1fr; }
  }
  .experiment-anim {
    background: #fff;
    border-radius: var(--radius-md);
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6), 0 6px 16px rgba(28,37,65,0.08);
  }
  .experiment-anim svg { width: 100%; max-width: 460px; height: auto; }

  /* Live reading panel */
  .live-reading {
    background: #1c2541;
    color: #fff;
    border-radius: var(--radius-md);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 8px 20px rgba(28,37,65,0.18);
  }
  .live-reading .live-head {
    display: flex; align-items: center; gap: 10px; justify-content: space-between;
    font-size: 0.95rem; color: #cfd8e3; letter-spacing: 0.02em;
  }
  .live-reading .live-tag {
    padding: 3px 10px; border-radius: 999px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
  }
  .live-reading .live-tag.tag-live    { background: #06d6a0; color: #052e2a; animation: blink 1.6s infinite ease-in-out; }
  .live-reading .live-tag.tag-stale   { background: #ffb703; color: #3a2400; }
  .live-reading .live-tag.tag-waiting { background: #cfd8e3; color: #1c2541; }
  .live-reading .live-tag.tag-offline { background: #ef476f; color: #fff; }
  .live-reading .live-number {
    display: flex; align-items: baseline; gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .live-reading .live-number .num {
    font-size: clamp(3rem, 8vw, 4.6rem);
    font-weight: 800;
    line-height: 1;
    color: #fff;
  }
  .live-reading .live-number .unit { font-size: 1.1rem; color: #cfd8e3; }
  .live-reading .live-status {
    font-size: 1.4rem; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .live-reading .live-status .status-emoji { font-size: 1.8rem; }
  .live-reading.status-unknown .live-status { color: #cfd8e3; }
  .live-reading.status-cool    .live-status { color: #8ddcff; }
  .live-reading.status-warming .live-status { color: #ffd166; }
  .live-reading.status-warm    .live-status { color: #ffb703; }
  .live-reading.status-hot     .live-status { color: #ff6b6b; }
  /* When the data is stale, dim the number/status so it's clear the
     value is not fresh, even though we keep showing it. */
  .live-reading.source-stale .live-number,
  .live-reading.source-stale .live-status { opacity: 0.55; }
  .live-reading.source-offline .live-number,
  .live-reading.source-offline .live-status { opacity: 0.4; }
  .live-reading .live-bar {
    height: 14px;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    overflow: hidden;
  }
  .live-reading .live-bar > span {
    display: block; height: 100%;
    background: linear-gradient(90deg, #4cc9f0, #ffd166, #ff6b6b);
    transition: width 0.8s ease;
  }
  .live-reading .live-foot {
    font-size: 0.85rem; color: #9aa6bd;
  }

  /* Recipe steps inside the experiment hero */
  .recipe {
    counter-reset: step;
    list-style: none;
    padding: 0;
    margin: 22px 0 0;
    display: grid;
    gap: 8px;
  }
  .recipe li {
    counter-increment: step;
    background: rgba(255,255,255,0.7);
    border-radius: var(--radius-md);
    padding: 12px 14px 12px 50px;
    position: relative;
    line-height: 1.5;
  }
  .recipe li::before {
    content: counter(step);
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 28px;
    background: #ff6b6b; color: #fff;
    font-weight: 800;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  /* Inline safety note (less alarming than the big yellow safety box) */
  .safety-inline {
    margin-top: 14px;
    background: #fff8e1;
    border-left: 6px solid #ffb703;
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 0.95rem;
  }

  /* Plain content card hint, used only sparingly now */
  .card-hint { margin-top: 10px; font-size: 0.8rem; opacity: 0.7; font-style: italic; }

  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* Examples */
  .examples {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-top: 10px;
  }
  .example {
    background: rgba(255,255,255,0.75);
    border-radius: var(--radius-md);
    padding: 12px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  }
  .example svg { width: 100%; height: 110px; display: block; }
  .example .cap { font-weight: bold; margin-top: 6px; font-size: 0.95rem; }
  .example .why { font-size: 0.85rem; color: var(--ink-soft); margin-top: 2px; }

  /* Wiring */
  .wiring-legend {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .legend-item {
    display: flex;
    gap: 10px;
    align-items: center;
    background: #faf7ee;
    border-radius: var(--radius-md);
    padding: 8px 10px;
    font-size: 0.95rem;
  }
  .swatch { width: 22px; height: 12px; border-radius: 4px; flex: 0 0 auto; }

  .ckt-note { font-size: 0.88rem; color: var(--ink-soft); margin: 8px 0 0; }
  .parts-list li { margin-bottom: 4px; }
  .station-circuit {
    background: #fff;
    border-radius: var(--radius-md);
    border: 2px solid #f0e7c8;
    padding: 10px;
    margin-top: 6px;
  }
  .station-circuit svg { width: 100%; height: auto; display: block; }
  .station-build {
    background: #faf7ee;
    border-left: 6px solid #06d6a0;
    border-radius: var(--radius-md);
    padding: 10px 12px;
    margin: 6px 0 0;
    line-height: 1.5;
  }

  .port-descriptions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 14px;
    margin: 8px 0 18px;
  }
  .desc-group {
    background: #faf7ee;
    border-radius: var(--radius-md);
    padding: 14px 16px;
    border: 2px solid #f0e7c8;
  }
  .desc-group h4 { margin: 0 0 8px; font-size: 1.05rem; }
  .desc-group ul { margin: 0; padding-left: 18px; list-style: none; }
  .desc-group > ul > li {
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px;
    align-items: start;
  }
  .desc-group > ul > li > .swatch {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    margin-top: 3px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .desc-group > ul > li:not(:has(.swatch)) {
    display: list-item;
    list-style: disc;
  }
  .desc-group .desc-text { font-size: 0.92rem; color: var(--ink-soft); margin-top: 2px; }

  .operate-bullets {
    list-style: none;
    padding: 0;
    margin: 8px 0 18px;
    display: grid;
    gap: 10px;
  }
  .operate-bullets li {
    display: grid;
    grid-template-columns: 36px 1fr;
    gap: 12px;
    align-items: start;
    background: #faf7ee;
    border-left: 6px solid #06d6a0;
    border-radius: var(--radius-md);
    padding: 10px 12px;
    line-height: 1.45;
  }
  .operate-bullets .bullet-icon {
    font-size: 1.5rem;
    line-height: 1;
    text-align: center;
  }
  .operate-bullets .bullet-text { font-size: 0.96rem; }
  .operate-bullets .bullet-text strong { color: #1c2541; }

  .connect-card {
    background: linear-gradient(135deg, #fff3a8, #ffd166, #ffb703);
    color: #1c2541;
    border: 4px dashed #fff;
  }
  .connect-card h2 { margin-top: 0; }
  .wifi-creds {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin: 12px 0 6px;
  }
  .wifi-creds .field {
    background: rgba(255,255,255,0.7);
    border-radius: var(--radius-md);
    padding: 10px 12px;
  }
  .wifi-creds .field .lbl {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .wifi-creds .field .val {
    font-size: 1.25rem;
    font-weight: bold;
    word-break: break-all;
    font-family: 'Courier New', monospace;
  }
  .connect-steps {
    list-style: none;
    padding: 0;
    margin: 10px 0 0;
    display: grid;
    gap: 6px;
  }
  .connect-steps li {
    background: rgba(255,255,255,0.55);
    padding: 8px 12px;
    border-radius: var(--radius-md);
    font-size: 0.95rem;
  }
  .connect-steps li::marker { color: #ff6b6b; }

  .connect-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 18px;
    align-items: start;
  }
  .connect-info { min-width: 0; }
  .qr-block {
    background: #fff;
    border: 3px solid #1c2541;
    border-radius: var(--radius-md);
    padding: 10px;
    text-align: center;
    align-self: start;
  }
  .qr-block img { display: block; width: 180px; height: 180px; }
  .qr-caption { margin-top: 6px; font-size: 0.9rem; font-weight: bold; color: #1c2541; }
  @media (max-width: 720px) {
    .connect-row { grid-template-columns: 1fr; justify-items: center; }
  }

  .steps { counter-reset: step; padding-left: 0; list-style: none; }
  .steps li {
    counter-increment: step;
    background: #faf7ee;
    border-left: 6px solid #ffb703;
    padding: 10px 12px 10px 44px;
    border-radius: var(--radius-md);
    margin-bottom: 8px;
    position: relative;
  }
  .steps li::before {
    content: counter(step);
    position: absolute;
    left: 10px; top: 8px;
    width: 26px; height: 26px;
    background: #ffb703; color: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }

  .safety {
    background: #fff3cd;
    border-left: 8px solid #ff6b6b;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    margin-top: 14px;
  }
  .safety strong { color: #c44a4a; }

  footer.foot { text-align: center; margin-top: 30px; color: var(--ink-soft); }

  /* Energy bolt animation */
  /* Spinner */
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .spin-slow { animation: spin 4s linear infinite; transform-origin: center; }
  .spin-fast { animation: spin 1.2s linear infinite; transform-origin: center; }

  /* Pulse */
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; }

  /* Bubble */
  @keyframes bubble { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
  .bubble { animation: bubble 2.2s ease-in infinite; }

  /* Sway */
  @keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .sway { animation: sway 2.4s ease-in-out infinite; transform-origin: bottom center; }

  /* Flicker */
  @keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  .flicker { animation: flicker 1.4s ease-in-out infinite; }

  /* Steam */
  @keyframes steam { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: 0.8; } 100% { transform: translateY(-30px); opacity: 0; } }
  .steam { animation: steam 2.6s ease-out infinite; }

  /* Foam erupt (elephant toothpaste) */
  @keyframes erupt {
    0%   { transform: translateY(14px) scale(0.3); opacity: 0; }
    20%  { opacity: 1; }
    60%  { transform: translateY(-6px) scale(1.15); opacity: 1; }
    100% { transform: translateY(-22px) scale(1.4); opacity: 0; }
  }
  .erupt { animation: erupt 2.8s ease-out infinite; transform-origin: center bottom; }

  /* Foam drip down flask sides */
  @keyframes drip {
    0%   { transform: translateY(-10px); opacity: 0; }
    25%  { opacity: 0.95; }
    100% { transform: translateY(14px); opacity: 0; }
  }
  .drip { animation: drip 2.8s ease-in infinite; }

  /* Heat wiggle for transferring heat into the Peltier */
  @keyframes wiggle {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-2px); }
    75%      { transform: translateX(2px); }
  }
  .wiggle { animation: wiggle 0.6s ease-in-out infinite; }


</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const formatReading = (v, unit) => v.toFixed(unit === 'mV' ? 0 : 2);

const STATIONS = [
  {
    id: 'heat',
    name: 'Heat Power Station',
    emoji: '🔥',
    cls: 'heat',
    from: 'Heat',
    to: 'Electricity',
    sensor: 'Peltier (TEC1-12706) + MCP3008 channel 1',
    unit: 'mV',
    range: [0, 3000],
    color: '#ff6b6b',
    blurb: 'A Peltier tile makes electricity when one side is warm and the other is cool. Even a warm hand can power an LED!',
    operate: [
      { icon: '🤝', text: <><strong>Warm one side with a finger.</strong> Pinch one face of the Peltier tile between your warm fingers for 10–15 seconds. Heat flows from your finger, through the ceramic, into the other side.</> },

const HISTORY_LENGTH = 60;  // ~30 s at 500 ms per sample — used by the time-series graph

// Source is a finite state machine:
//   'waiting' — never received a sample yet
//   'live'    — a real sample arrived within the last few polls
//   'stale'   — was live, but the last few polls failed (still show the
//               last known number, but mark it as not-fresh)
//   'offline' — sustained failure, we're back to a true disconnect
const STALE_AFTER_FAILS = 3;       // ≈ 3 × 500 ms of consecutive failures
const OFFLINE_AFTER_FAILS = 8;     // ≈ 3 × 500 ms + 5 × 3 s back-off

function useLiveReadings() {
  // Start empty, NOT seeded to 0. Seeding to 0 makes a working Pi reading a
  // genuinely cool tile (0 mV) indistinguishable from the never-connected
  // state, and also hides API-contract drift (server stops sending 'heat')
  // behind a silent 0 mV.
  const [readings, setReadings] = useState({});
  const [source, setSource] = useState('waiting');
  const [history, setHistory] = useState(() =>
    Object.fromEntries(STATIONS.map(s => [s.id, []]))
  );

  useEffect(() => {
    let cancelled = false;
    let timer = null;
    let consecutiveFails = 0;
    let everConnected = false;

    const step = async () => {
      if (cancelled) return;
      try {
        const r = await fetch('/api/readings', { cache: 'no-store' });
        if (!r.ok) throw new Error('http ' + r.status);
        const j = await r.json();
        if (cancelled) return;
        let gotValidSample = false;
        setReadings(prev => {
          let changed = false;
          const next = { ...prev };
          STATIONS.forEach(s => {
            const v = j[s.id];
            // Number.isFinite excludes NaN and Infinity (typeof both === 'number');
            // those would silently break heatStatus() and TimeSeriesGraph.
            if (Number.isFinite(v)) {
              gotValidSample = true;
              if (v !== prev[s.id]) {
                next[s.id] = v;
                changed = true;
              }
            }
          });
          return changed ? next : prev;
        });
        setHistory(prev => {
          let changed = false;
          const next = { ...prev };
          STATIONS.forEach(s => {
            const v = j[s.id];
            if (Number.isFinite(v)) {
              const arr = (prev[s.id] || []).concat(v);
              if (arr.length > HISTORY_LENGTH) arr.splice(0, arr.length - HISTORY_LENGTH);
              next[s.id] = arr;
              changed = true;
            }
          });
          return changed ? next : prev;
        });
        if (gotValidSample) {
          everConnected = true;
          consecutiveFails = 0;
          setSource('live');
        }
        timer = setTimeout(step, 500);
      } catch {
        if (cancelled) return;
        consecutiveFails += 1;
        // Don't flip to a "waiting/offline" badge on a single transient
        // blip — kids see a real number with a contradicting "WAITING"
        // label otherwise. Stay in the last known state until several
        // polls have failed in a row.
        if (!everConnected) {
          setSource('waiting');
        } else if (consecutiveFails >= OFFLINE_AFTER_FAILS) {
          setSource('offline');
        } else if (consecutiveFails >= STALE_AFTER_FAILS) {
          setSource('stale');
        }
        timer = setTimeout(step, 3000);  // back off and retry
      }
    };

    step();
    return () => { cancelled = true; clearTimeout(timer); };
  }, []);

  return { readings, source, history };
}

// Translate a raw mV reading into a kid-readable status. Plain-language
// labels matter for accessibility: kids (and screen-reader users) can
// understand "HOT!" before they parse "1843 mV". `value` may be undefined
// when no sample has arrived yet — return a distinct "unknown" status so
// the UI doesn't pretend a cool 0 mV reading is in hand.
function heatStatus(value) {
  if (!Number.isFinite(value)) {
    return { id: 'unknown', emoji: '⏳', label: 'No reading yet', pct: 0 };
  }
  const pct = clamp(value / 3000, 0, 1) * 100;
  if (value >= 1500) return { id: 'hot',     emoji: '🔥',  label: 'HOT!',        pct };
  if (value >= 500)  return { id: 'warm',    emoji: '🔥',  label: 'Warm',        pct };
  if (value >= 100)  return { id: 'warming', emoji: '🌡️', label: 'Warming up',  pct };
  return                  { id: 'cool',    emoji: '🧊',  label: 'Cool',          pct };
}

function TimeSeriesGraph({ data, color, unit, min, max }) {
  const W = 480, H = 160;
  const PAD_L = 46, PAD_R = 14, PAD_T = 14, PAD_B = 24;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;

  // Defensive: filter out NaN/Infinity. typeof NaN === 'number' so the
  // upstream `Number.isFinite` guard catches them, but if a future caller
  // (or a debug session) hands in a poisoned array, Math.min/Math.max
  // would propagate NaN through every coordinate and the polyline would
  // silently render as 'NaN,NaN ...' — i.e. the graph disappears with no
  // error. Stripping non-finite values keeps the rest of the trace.
  const safeData = (data || []).filter(Number.isFinite);
  if (safeData.length < 2) {
    return (
      <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label="Waiting for the first samples from the Pi" style={{ width: '100%', height: 'auto', background: '#fafaf2', borderRadius: 8 }}>
        <text x={W/2} y={H/2} textAnchor="middle" fill="#666" fontSize="13">
          waiting for samples from the Pi…
        </text>
      </svg>
    );
  }
  const latest = safeData[safeData.length - 1];
  const summary = `Heat reading over the last ${Math.round(HISTORY_LENGTH * 0.5)} seconds. Latest value ${formatReading(latest, unit)} ${unit}.`;

  const N = safeData.length;
  const lo = Math.min(min, ...safeData);
  const hi = Math.max(max, ...safeData, lo + 0.001);
  const xMap = (i) => PAD_L + (((HISTORY_LENGTH - N) + i) / (HISTORY_LENGTH - 1)) * innerW;
  const yMap = (v) => PAD_T + innerH - ((v - lo) / (hi - lo)) * innerH;

  const points = safeData.map((v, i) => `${xMap(i).toFixed(1)},${yMap(v).toFixed(1)}`).join(' ');
  const lastX = xMap(N - 1);
  const lastY = yMap(safeData[N - 1]);

  const ticks = Array.from({ length: 5 }, (_, i) => lo + (i / 4) * (hi - lo));

  return (
    <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label={summary} style={{ width: '100%', height: 'auto', background: '#fafaf2', borderRadius: 8 }}>
      {ticks.map((v, i) => {
        const yy = yMap(v);
        return (
          <g key={i}>
            <line x1={PAD_L} y1={yy} x2={W - PAD_R} y2={yy} stroke="#e3e0d2" strokeDasharray="3 4" />
            <text x={PAD_L - 6} y={yy + 3} textAnchor="end" fontSize="9" fill="#888">
              {formatReading(v, unit)}
            </text>
          </g>
        );
      })}
      <line x1={PAD_L} y1={PAD_T} x2={PAD_L} y2={H - PAD_B} stroke="#bbb" />
      <line x1={PAD_L} y1={H - PAD_B} x2={W - PAD_R} y2={H - PAD_B} stroke="#bbb" />
      <polygon points={`${xMap(0)},${H - PAD_B} ${points} ${lastX},${H - PAD_B}`}
        fill={color} fillOpacity="0.18" />
      <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={lastX} cy={lastY} r="4" fill={color} stroke="#fff" strokeWidth="1.5" />
      <text x={(PAD_L + W - PAD_R) / 2} y={H - 6} textAnchor="middle" fontSize="10" fill="#666">
        last {Math.round(HISTORY_LENGTH * 0.5)} seconds  →  newest on the right
      </text>
      <text x={6} y={PAD_T + 4} fontSize="10" fill="#666">{unit}</text>
    </svg>
  );
}

const PI_USED_PIN_COLOR = {

const MCP_PIN_NAMES = {

  9:'DGND', 10:'CS', 11:'DIN', 12:'DOUT', 13:'CLK', 14:'AGND', 15:'VREF', 16:'VDD',
};
// Physical chip orientation: CH0-CH7 on the left of the chip, VDD..DGND on the right.
const MCP_LEFT_PINS  = [1, 2, 3, 4, 5, 6, 7, 8];
const MCP_RIGHT_PINS = [16, 15, 14, 13, 12, 11, 10, 9];

function WiringDiagram() {
  const wires = [
    { color: '#e63946', label: 'Red — 3V3 power (Pi pin 1)' },
    { color: '#000',    label: 'Black — Ground (Pi pin 6)' },
    { color: '#ffb703', label: 'Yellow — SPI SCLK (Pi pin 23 / GPIO11)' },
    { color: '#06d6a0', label: 'Green — SPI MISO (Pi pin 21 / GPIO9)' },
    { color: '#4cc9f0', label: 'Blue — SPI MOSI (Pi pin 19 / GPIO10)' },
    { color: '#b5179e', label: 'Purple — SPI CE0 (Pi pin 24 / GPIO8)' },
  ];

  // Pi sits on the right side of the diagram so its left edge faces the chip.
  const PIN_X_L = 560, PIN_X_R = 588, PIN_TOP = 80, PIN_DY = 34, PIN_W = 22, PIN_H = 20;
  const pinPos = (n) => {
    const pair = Math.ceil(n / 2);
    const isLeft = n % 2 === 1;
    const x = isLeft ? PIN_X_L : PIN_X_R;
    const y = PIN_TOP + (pair - 1) * PIN_DY;
    return { x, y, cy: y + PIN_H / 2, leftEdge: x, rightEdge: x + PIN_W };
  };

  // Chip in the middle of the diagram, physical-orientation (notch top, CH on left, SPI on right).
  // Pins 1-8 (CH0-CH7) sit on the chip's LEFT edge, pins 9-16 (DGND..VDD) on the RIGHT.
  const MCP_X = 320, MCP_Y = 150, MCP_W = 140, MCP_H = 320;
  const mcpPos = (n) => {
    const onLeft = n <= 8;
    const order = onLeft ? MCP_LEFT_PINS : MCP_RIGHT_PINS;
    const idx = order.indexOf(n);
    const y = MCP_Y + 30 + idx * ((MCP_H - 60) / 7);
    return { x: onLeft ? MCP_X : MCP_X + MCP_W, y, onLeft };
  };

  const wirePath = (piPin, mcpPin, color) => {
    const p = pinPos(piPin);
    const m = mcpPos(mcpPin);
    const startX = p.leftEdge;  // Pi pin's left edge faces the chip on its left
    const midX = (startX + m.x) / 2;
    const d = `M ${startX} ${p.cy} C ${midX} ${p.cy}, ${midX} ${m.y}, ${m.x} ${m.y}`;
    return (
      <g key={`${piPin}-${mcpPin}`} filter="url(#wireGlow)">
        <path d={d} stroke="#fff" strokeWidth="6" fill="none" strokeLinecap="round" />
        <path d={d} stroke={color} strokeWidth="3.5" fill="none" strokeLinecap="round" />
      </g>
    );
  };

  const VDDy = mcpPos(16).y;
  const VREFy = mcpPos(15).y;
  const AGNDy = mcpPos(14).y;
  const DGNDy = mcpPos(9).y;

  return (
    <div className="card">
      <h2>🔌 Build It! Wiring Diagram</h2>
      <p>This is the real circuit. The little parts (a couple of resistors and two diodes) are seat-belts that keep too much voltage from reaching the tiny Pi. Ask a grown-up to help, and always unplug the Pi before changing wires.</p>

      <h3>The whole circuit — Pi ↔ MCP3008 ↔ Peltier</h3>
      <p style={{ margin: '0 0 10px', color: 'var(--ink-soft)' }}>
        The chip is drawn the same way it sits on the breadboard: <strong>notch at the top, CH0–CH7 on the left, VDD/VREF/AGND/CLK/DOUT/DIN/CS/DGND on the right</strong>. Match each coloured wire from the Pi pin number to the matching MCP pin number on the diagram.
      </p>
      <svg viewBox="0 0 760 820" style={{ width: '100%', height: 'auto', background: '#fbfaf3', borderRadius: 18 }}>
        <defs>
          <filter id="wireGlow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="1.2" stdDeviation="0.9" floodColor="#000" floodOpacity="0.25" />
          </filter>
        </defs>
        {/* Pi board background (on the right side of the diagram so its 40-pin header faces the chip) */}
        <rect x="540" y="50" width="200" height="760" rx="14" fill="#0f5132" />
        <text x="640" y="74" textAnchor="middle" fontSize="13" fontWeight="bold" fill="#fff">Raspberry Pi Zero 2 W</text>
        <rect x="630" y="100" width="86" height="58" fill="#222" />
        <text x="673" y="133" textAnchor="middle" fill="#fff" fontSize="11">BCM2710</text>
        <rect x="630" y="170" width="56" height="32" fill="#444" />
        <text x="658" y="190" textAnchor="middle" fill="#fff" fontSize="9">SD card</text>
        <rect x="630" y="780" width="60" height="22" rx="3" fill="#222" />
        <text x="660" y="795" textAnchor="middle" fontSize="9" fill="#fff">micro-USB</text>
        <text x={PIN_X_L} y={PIN_TOP - 8} fontSize="9" fill="#ffd166" fontWeight="bold">↓ pin 1 (top corner)</text>
        <text x="640" y="810" textAnchor="middle" fontSize="9" fill="#ffd166" fontStyle="italic">all 40 GPIO pins shown</text>

        {/* Wires drawn first so pin squares sit on top */}
        {wirePath(1, 16, '#e63946')}
        {/* VDD ↔ VREF jumper on the chip's right side */}
        <g>
          <circle cx={MCP_X + MCP_W + 18} cy={VDDy} r="3" fill="#e63946" />
          <path d={`M ${MCP_X + MCP_W} ${VDDy} L ${MCP_X + MCP_W + 18} ${VDDy} L ${MCP_X + MCP_W + 18} ${VREFy} L ${MCP_X + MCP_W} ${VREFy}`}
            stroke="#e63946" strokeWidth="2.5" fill="none" />
        </g>
        {wirePath(6, 9, '#000')}
        {/* DGND ↔ AGND jumper on the chip's right side */}
        <g>
          <circle cx={MCP_X + MCP_W + 32} cy={DGNDy} r="3" fill="#000" />
          <path d={`M ${MCP_X + MCP_W} ${DGNDy} L ${MCP_X + MCP_W + 32} ${DGNDy} L ${MCP_X + MCP_W + 32} ${AGNDy} L ${MCP_X + MCP_W} ${AGNDy}`}
            stroke="#000" strokeWidth="2.5" fill="none" />
        </g>
        {wirePath(23, 13, '#ffb703')}
        {wirePath(21, 12, '#06d6a0')}
        {wirePath(19, 11, '#4cc9f0')}
        {wirePath(24, 10, '#b5179e')}

        {/* MCP3008 chip body */}
        <rect x={MCP_X} y={MCP_Y} width={MCP_W} height={MCP_H} rx="6" fill="#1c2541" />
        <text x={MCP_X + MCP_W/2} y={MCP_Y + 18} textAnchor="middle" fontSize="13" fontWeight="bold" fill="#fff">MCP3008</text>
        <text x={MCP_X + MCP_W/2} y={MCP_Y + 34} textAnchor="middle" fontSize="9" fill="#aaa">8-ch SPI ADC</text>
        <circle cx={MCP_X + MCP_W/2} cy={MCP_Y + 3} r="5" fill="#fbfaf3" />
        <text x={MCP_X + MCP_W/2 + 10} y={MCP_Y + 6} fontSize="8" fill="#fbfaf3">notch = top</text>

        {/* MCP pins on left side (CH0-CH7, top to bottom) — physical chip orientation */}
        {MCP_LEFT_PINS.map(pin => {
          const p = mcpPos(pin);
          return (
            <g key={`L${pin}`}>
              <rect x={p.x - 14} y={p.y - 4} width="14" height="8" fill="#cfd8e3" />
              <text x={p.x - 18} y={p.y + 4} textAnchor="end" fontSize="11" fill="#1c2541" fontWeight="bold">{pin}</text>
              <text x={p.x + 8} y={p.y + 4} fontSize="11" fill="#fff" fontWeight="bold">{MCP_PIN_NAMES[pin]}</text>
            </g>
          );
        })}
        {/* MCP pins on right side (16 VDD → 9 DGND, top to bottom) — physical chip orientation */}
        {MCP_RIGHT_PINS.map(pin => {
          const p = mcpPos(pin);
          return (
            <g key={`R${pin}`}>
              <rect x={p.x} y={p.y - 4} width="14" height="8" fill="#cfd8e3" />
              <text x={p.x + 18} y={p.y + 4} fontSize="11" fill="#1c2541" fontWeight="bold">{pin}</text>
              <text x={p.x - 8} y={p.y + 4} textAnchor="end" fontSize="11" fill="#fff" fontWeight="bold">{MCP_PIN_NAMES[pin]}</text>
            </g>
          );
        })}

        {/* Station signal arrow on the LEFT side of MCP pointing INTO CH1 */}
        {[
          { ch: 2, emoji: '🔥', name: 'Heat signal in' },
        ].map(s => {
          const c = mcpPos(s.ch);
          return (
            <g key={s.ch}>
              <line x1={c.x - 110} y1={c.y} x2={c.x - 20} y2={c.y} stroke="#1c2541" strokeWidth="2" />
              <polygon points={`${c.x - 20},${c.y - 5} ${c.x - 20},${c.y + 5} ${c.x - 8},${c.y}`} fill="#1c2541" />
              <text x={c.x - 116} y={c.y + 4} textAnchor="end" fontSize="11" fill="#1c2541" fontWeight="bold">{s.emoji} {s.name}</text>
              <text x={c.x - 116} y={c.y + 16} textAnchor="end" fontSize="9" fill="#1c2541">(from circuit below)</text>
            </g>
          );
        })}

        {/* Pi pin squares — drawn last so they sit on top of any crossing wires */}
        <text x={PIN_X_L + PIN_W/2} y={PIN_TOP - 6} textAnchor="middle" fontSize="9" fontWeight="bold" fill="#fff">odd</text>
        <text x={PIN_X_R + PIN_W/2} y={PIN_TOP - 6} textAnchor="middle" fontSize="9" fontWeight="bold" fill="#fff">even</text>
        {Array.from({length: 20}).map((_, i) => {
          const yTop = PIN_TOP + i * PIN_DY;
          const leftN = i * 2 + 1, rightN = leftN + 1;
          const leftColor = PI_USED_PIN_COLOR[leftN], rightColor = PI_USED_PIN_COLOR[rightN];
          return (
            <g key={i}>
              <rect x={PIN_X_L} y={yTop} width={PIN_W} height={PIN_H} rx="3"
                fill={leftColor || '#ffd166'} stroke="#fff" strokeWidth={leftColor ? '2.5' : '1'} opacity={leftColor ? 1 : 0.7} />
              <text x={PIN_X_L - 5} y={yTop + 14} textAnchor="end" fontSize="11" fill="#fff" fontWeight="bold">{leftN}</text>
              <text x={PIN_X_L + PIN_W/2} y={yTop + 14} textAnchor="middle" fontSize="9" fontWeight="bold"
                fill={leftColor ? '#fff' : '#1c2541'}>{PI_PIN_NAMES[leftN - 1]}</text>
              <rect x={PIN_X_R} y={yTop} width={PIN_W} height={PIN_H} rx="3"
                fill={rightColor || '#ffd166'} stroke="#fff" strokeWidth={rightColor ? '2.5' : '1'} opacity={rightColor ? 1 : 0.7} />
              <text x={PIN_X_R + PIN_W/2} y={yTop + 14} textAnchor="middle" fontSize="9" fontWeight="bold"
                fill={rightColor ? '#fff' : '#1c2541'}>{PI_PIN_NAMES[rightN - 1]}</text>
              <text x={PIN_X_R + PIN_W + 5} y={yTop + 14} fontSize="11" fill="#fff" fontWeight="bold">{rightN}</text>
            </g>
          );
        })}
      </svg>

      <h3>🔎 What each connection does</h3>
      <p style={{ color: 'var(--ink-soft)', margin: '4px 0 12px' }}>
        Every wire and every part has a job. Here's the cheat-sheet:
      </p>

      <div className="port-descriptions">
        <div className="desc-group">
          <h4>🥧 Raspberry Pi pins we use</h4>
          <ul>
            <li><span className="swatch" style={{ background: '#e63946' }}/><div><strong>Pin 1 — 3V3 (red wire)</strong><div className="desc-text">The Pi's regulated 3.3 V power supply. Powers the MCP3008 chip through pin 16 (VDD) and sets the chip's reference voltage through pin 15 (VREF).</div></div></li>
            <li><span className="swatch" style={{ background: '#000' }}/><div><strong>Pin 6 — GND (black wire)</strong><div className="desc-text">The 0 V "ground" line. All other voltages in the circuit are measured against this. The Pi has many GND pins (6, 9, 14, 20, 25, 30, 34, 39) — any one works.</div></div></li>
            <li><span className="swatch" style={{ background: '#4cc9f0' }}/><div><strong>Pin 19 — GPIO 10 / MOSI (blue wire)</strong><div className="desc-text">"Master Out, Slave In." Carries commands FROM the Pi TO the chip — like "please read channel 0 now".</div></div></li>
            <li><span className="swatch" style={{ background: '#06d6a0' }}/><div><strong>Pin 21 — GPIO 9 / MISO (green wire)</strong><div className="desc-text">"Master In, Slave Out." Carries the answer FROM the chip BACK TO the Pi — a 10-bit number between 0 and 1023 representing the voltage on the requested channel.</div></div></li>
            <li><span className="swatch" style={{ background: '#ffb703' }}/><div><strong>Pin 23 — GPIO 11 / SCLK (yellow wire)</strong><div className="desc-text">Serial Clock. The Pi ticks this line high–low–high–low and on every tick both sides move one bit of data. No clock = no communication.</div></div></li>
            <li><span className="swatch" style={{ background: '#b5179e' }}/><div><strong>Pin 24 — GPIO 8 / CE0 (purple wire)</strong><div className="desc-text">Chip Enable 0. The Pi pulls this LOW to say "talk to me now" and HIGH again when finished. Lets you share the SPI bus with more chips later.</div></div></li>
          </ul>
        </div>

        <div className="desc-group">
          <h4>🔬 MCP3008 chip pins</h4>
          <ul>
            <li><strong>Pin 2 (CH1)</strong> — Analog input for the <em>Heat</em> station. The voltage at this pin gets sampled and turned into a 0–1023 number.</li>
            <li><strong>Pins 1, 3–8 (CH0, CH2–CH7)</strong> — Seven spare channels. Unused in this build; great for adding more sensors later.</li>
            <li><strong>Pin 9 (DGND)</strong> — Digital ground. Wired to Pi pin 6.</li>
            <li><strong>Pin 10 (CS)</strong> — Chip Select input. Listens to Pi pin 24 to know when to wake up.</li>
            <li><strong>Pin 11 (DIN)</strong> — Data In. Receives instructions from Pi pin 19.</li>
            <li><strong>Pin 12 (DOUT)</strong> — Data Out. Sends measurements to Pi pin 21.</li>
            <li><strong>Pin 13 (CLK)</strong> — Clock input. Marches in time with Pi pin 23.</li>
            <li><strong>Pin 14 (AGND)</strong> — Analog ground. Jumpered to DGND (pin 9) so analog and digital sides share the same 0 V reference.</li>
            <li><strong>Pin 15 (VREF)</strong> — Reference voltage. Jumpered to VDD (pin 16) so the chip uses 3.3 V as the "full scale" — anything above 3.3 V on a CH pin just reads as max (1023).</li>
            <li><strong>Pin 16 (VDD)</strong> — Power. Receives 3.3 V from Pi pin 1.</li>
          </ul>
        </div>

      </div>

      <p style={{ marginTop: 14, padding: '10px 12px', background: '#eaf6ff', borderLeft: '6px solid #4cc9f0', borderRadius: 10 }}>
        ⚡ <strong>The Heat station's parts, mini-schematic and build step</strong> are right above this diagram (in the same "For builders" panel).
      </p>

      <h3>Wire colour key</h3>
      <div className="wiring-legend">
        {wires.map(w => (
          <div className="legend-item" key={w.label}>
            <span className="swatch" style={{ background: w.color }} />
            <span>{w.label}</span>
          </div>
        ))}
      </div>

      <h3>Extra parts you'll need (on top of the Peltier tile)</h3>
      <ul className="parts-list">
        <li><strong>Resistors (¼ W):</strong> 1× 1kΩ (R1, series limiter), 1× 10kΩ (R2, pull-down)</li>
        <li><strong>Diodes:</strong> 2× 1N4007 rectifier (D1 reverse-voltage clamp, D2 over-voltage clamp). 1N4148 also works — either is fine because R1 holds the clamp current to a few mA.</li>
      </ul>

      <h3>Build the Pi ↔ MCP3008 brain</h3>
      <p style={{ marginTop: 0, color: 'var(--ink-soft)' }}>
        These steps wire up the chip itself. For the Peltier mini-circuit (parts + schematic + build step), scroll up to the Heat station card — everything is in one place there.
      </p>
      <ol className="steps">
        <li>Switch off the Pi and unplug the power cable. Safety first!</li>
        <li>Plug the MCP3008 into the middle of the breadboard so its legs straddle the gap. The notch (or dot) marks pin&nbsp;1.</li>
        <li><strong>Power:</strong> <em>red</em> wire from Pi <strong>pin 1</strong> (3V3) to MCP <strong>pin 16</strong> (VDD); add a short jumper from MCP pin 16 to MCP <strong>pin 15</strong> (VREF).</li>
        <li><strong>Ground:</strong> <em>black</em> wire from Pi <strong>pin 6</strong> (GND) to MCP <strong>pin 9</strong> (DGND); short jumper from pin 9 to MCP <strong>pin 14</strong> (AGND).</li>
        <li><strong>SPI:</strong> <em>yellow</em> Pi <strong>pin 23</strong> (SCLK/GPIO11) → MCP <strong>pin 13</strong> (CLK); <em>green</em> Pi <strong>pin 21</strong> (MISO/GPIO9) → MCP <strong>pin 12</strong> (DOUT); <em>blue</em> Pi <strong>pin 19</strong> (MOSI/GPIO10) → MCP <strong>pin 11</strong> (DIN); <em>purple</em> Pi <strong>pin 24</strong> (CE0/GPIO8) → MCP <strong>pin 10</strong> (CS).</li>
        <li>Build the Heat station's mini-circuit using the card above (Heat → CH1).</li>
        <li>Double-check every part letter (R1, R2, D1, D2) against the diagram before powering on.</li>
        <li>
          Plug the Pi back in and start the server. Two options:
          <ul style={{ marginTop: 6 }}>
            <li><strong>Easy — Pi makes its own Wi-Fi:</strong> run <code>sudo bash pi/setup-hotspot.sh</code> once. The Pi will broadcast a Wi-Fi network called <strong>EnergyDetectives</strong> (password <strong>lightning</strong>). Join it from any device and the dashboard pops up automatically.</li>
            <li><strong>Already on home Wi-Fi:</strong> run <code>python3 pi/energy_detective.py</code> and open <code>http://&lt;pi-ip&gt;:8080</code> from any device on the same Wi-Fi (find the IP with <code>hostname -I</code>).</li>
          </ul>
        </li>
      </ol>

      <div className="safety">
        <strong>Grown-up helper rules:</strong>
        <ul style={{ margin: '6px 0 0 18px' }}>
          <li>Never plug the Peltier <em>directly</em> into a chip channel — always go through R1 and the clamp diodes.</li>
          <li>Each diode has a stripe on one end (the cathode — 1N4007 has a thick silver band, 1N4148 a thinner black one). For D2 the stripe faces the 3V3 rail; for D1 the stripe faces the signal node (away from GND).</li>
          <li>For the elephant-toothpaste experiment, always use a grown-up helper. Stick to drug-store 3% hydrogen peroxide — never the 30%+ "concentrated" kind, which burns skin.</li>
          <li>The Peltier can get warm — hold the hot side with a coin or metal spoon, not bare fingers.</li>
          <li>Always unplug the Pi before changing wires.</li>
        </ul>
      </div>
    </div>
  );
}

function useWifiInfo() {
  const [info, setInfo] = useState(null);
  useEffect(() => {
    let cancelled = false;
    fetch('/api/wifi', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(j => { if (!cancelled && j) setInfo(j); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);
  return info;
}

function App() {
  const { readings, source, history } = useLiveReadings();
  const wifi = useWifiInfo();
  const station = STATIONS[0];
  // Defensive: an empty STATIONS array (future refactor) would otherwise
  // throw "Cannot read properties of undefined (reading 'id')" and blank
  // the dashboard. Render a clear empty state instead.
  if (!station) {
    return (
      <div className="wrap">
        <p role="alert">No stations are configured. Add an entry to <code>STATIONS</code> to see the dashboard.</p>
      </div>
    );
  }
  // Pass the raw reading through (may be undefined until the first sample
  // arrives). ExperimentHero and TimeSeriesGraph each render a distinct
  // "no data yet" state — collapsing undefined to 0 hid the difference
  // between "Pi sitting on a cool table" and "API contract drifted".
  const value = readings[station.id];
  const heatHistory = history[station.id] || [];

  return (
    <>
      <a className="skip-link" href="#main">Skip to main content</a>
      <div className="wrap">
        <header className="hero">
          <h1>⚡ Vidyuth + Sam's Elephant Toothpaste Energy Detectives ⚡</h1>

              <span>Built with Claude AI</span>

                  <div className="qr-caption">📷 Scan to join</div>
                </div>
              </div>
            </section>
          )}

          <ExperimentHero value={value} source={source} />

          <VoltageGraphSection station={station} history={heatHistory} />

          <ExploreSection station={station} />

        <footer className="foot">
          Made with ⚡ and ❤️ for curious kids · A Raspberry Pi Zero 2 W STEM project
        </footer>
      </div>
    </>
  );
}
