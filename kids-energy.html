<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Energy Detectives! — A Raspberry Pi Kids Project</title>
<meta name="description" content="A fun, kid-friendly STEM project that turns a Raspberry Pi Zero 2 into an Energy Detective with 4 hands-on stations: Sun, Wind, Heat and Lemon power." />

<link rel="preconnect" href="https://unpkg.com" crossorigin />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<style>
  :root {
    --bg-1: #fff7d6;
    --bg-2: #ffe0f0;
    --bg-3: #d6f0ff;
    --ink:  #1c2541;
    --ink-soft: #4a5779;
    --sun:  #ffb703;
    --wind: #56cfe1;
    --heat: #ff6b6b;
    --lemon:#caffbf;
    --card-shadow: 0 12px 30px rgba(28,37,65,0.12);
    --radius-lg: 22px;
    --radius-md: 14px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 10%, var(--bg-1) 0, transparent 40%),
      radial-gradient(circle at 90% 20%, var(--bg-2) 0, transparent 45%),
      radial-gradient(circle at 50% 90%, var(--bg-3) 0, transparent 50%),
      #fffefb;
    min-height: 100vh;
    line-height: 1.5;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 22px 80px; }

  header.hero {
    text-align: center;
    padding: 30px 16px 10px;
  }
  header.hero h1 {
    font-size: clamp(2rem, 5vw, 3.4rem);
    margin: 0 0 6px;
    background: linear-gradient(90deg, #ff6b6b, #ffb703, #06d6a0, #4cc9f0, #b5179e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 0 rgba(255,255,255,0.5);
  }
  header.hero p.sub {
    font-size: clamp(1rem, 2vw, 1.25rem);
    color: var(--ink-soft);
    max-width: 720px;
    margin: 6px auto 0;
  }
  .badges { margin-top: 14px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .badge {
    background: white;
    border: 2px dashed #ffb703;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.95rem;
    box-shadow: var(--card-shadow);
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 26px 0 18px;
  }
  .tab {
    cursor: pointer;
    background: white;
    border: 3px solid transparent;
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: bold;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    box-shadow: var(--card-shadow);
    transition: transform .15s ease, border-color .15s ease;
  }
  .tab:hover { transform: translateY(-2px); }
  .tab.active { border-color: #ff6b6b; transform: translateY(-2px); }

  /* Cards / sections */
  .card {
    background: white;
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: var(--card-shadow);
    margin-bottom: 22px;
  }
  h2 { margin: 0 0 10px; font-size: 1.6rem; }
  h3 { margin: 12px 0 8px; }

  /* Station grid */
  .stations {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
  }
  .station {
    border-radius: var(--radius-lg);
    padding: 18px;
    color: var(--ink);
    position: relative;
    overflow: hidden;
    box-shadow: var(--card-shadow);
    border: 4px solid white;
  }
  .station.solar { background: linear-gradient(160deg, #fff3a8, #ffd166); }
  .station.wind  { background: linear-gradient(160deg, #caf0f8, #90e0ef); }
  .station.heat  { background: linear-gradient(160deg, #ffd6d6, #ff9aa2); }
  .station.lemon { background: linear-gradient(160deg, #d8f3dc, #b7e4c7); }
  .station h3 { display: flex; align-items: center; gap: 8px; font-size: 1.25rem; margin: 0 0 8px; }
  .station .emoji { font-size: 1.8rem; }
  .station .what {
    background: rgba(255,255,255,0.6);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    margin: 8px 0;
    font-size: 0.95rem;
  }
  .reading {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-weight: bold;
    font-size: 1.4rem;
    margin-top: 6px;
  }
  .reading .unit { font-size: 0.85rem; color: var(--ink-soft); font-weight: normal; }
  .bar {
    height: 10px;
    background: rgba(255,255,255,0.6);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 8px;
  }
  .bar > span {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, #06d6a0, #ffd166, #ff6b6b);
    transition: width .8s ease;
  }

  /* Presentation slide */
  .slide {
    border-radius: var(--radius-lg);
    background: linear-gradient(135deg, #0b132b, #1c2541);
    color: #f6f7fb;
    padding: 26px;
    box-shadow: var(--card-shadow);
    position: relative;
    overflow: hidden;
  }
  .slide h2 { color: #ffd166; }
  .slide .pi {
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
    background: rgba(255,255,255,0.06);
    border-radius: var(--radius-md);
    padding: 14px;
    margin: 12px 0;
  }
  .slide .pi .dot {
    width: 14px; height: 14px; border-radius: 50%; background: #06d6a0;
    box-shadow: 0 0 14px #06d6a0;
    animation: blink 1.4s infinite ease-in-out;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .energy-flow {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 10px;
  }
  .flow-cell {
    background: rgba(255,255,255,0.08);
    border-radius: var(--radius-md);
    padding: 10px;
    text-align: center;
    font-size: 0.9rem;
  }
  .flow-cell .big { font-size: 1.4rem; font-weight: bold; margin: 4px 0; }
  .flow-cell .lbl { opacity: .8; }

  .progress-rings { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
  .ring-wrap { text-align: center; }
  .ring-wrap .name { margin-top: 6px; font-size: 0.95rem; opacity: .9; }

  /* Examples */
  .examples {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-top: 10px;
  }
  .example {
    background: rgba(255,255,255,0.75);
    border-radius: var(--radius-md);
    padding: 12px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  }
  .example svg { width: 100%; height: 110px; display: block; }
  .example .cap { font-weight: bold; margin-top: 6px; font-size: 0.95rem; }
  .example .why { font-size: 0.85rem; color: var(--ink-soft); margin-top: 2px; }

  /* Wiring */
  .wiring-legend {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .legend-item {
    display: flex;
    gap: 10px;
    align-items: center;
    background: #faf7ee;
    border-radius: var(--radius-md);
    padding: 8px 10px;
    font-size: 0.95rem;
  }
  .swatch { width: 22px; height: 12px; border-radius: 4px; flex: 0 0 auto; }

  .circuits-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 14px;
    margin-top: 10px;
  }
  .circuit-card {
    background: #faf7ee;
    border-radius: var(--radius-md);
    padding: 12px 14px;
    border: 2px solid #f0e7c8;
  }
  .circuit-card h4 { margin: 0 0 8px; font-size: 1.05rem; }
  .circuit-card svg { width: 100%; height: auto; background: #fff; border-radius: 10px; }
  .ckt-note { font-size: 0.88rem; color: var(--ink-soft); margin: 8px 0 0; }
  .parts-list li { margin-bottom: 4px; }

  .connect-card {
    background: linear-gradient(135deg, #fff3a8, #ffd166, #ffb703);
    color: #1c2541;
    border: 4px dashed #fff;
  }
  .connect-card h2 { margin-top: 0; }
  .wifi-creds {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin: 12px 0 6px;
  }
  .wifi-creds .field {
    background: rgba(255,255,255,0.7);
    border-radius: var(--radius-md);
    padding: 10px 12px;
  }
  .wifi-creds .field .lbl {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .wifi-creds .field .val {
    font-size: 1.25rem;
    font-weight: bold;
    word-break: break-all;
    font-family: 'Courier New', monospace;
  }
  .connect-steps {
    list-style: none;
    padding: 0;
    margin: 10px 0 0;
    display: grid;
    gap: 6px;
  }
  .connect-steps li {
    background: rgba(255,255,255,0.55);
    padding: 8px 12px;
    border-radius: var(--radius-md);
    font-size: 0.95rem;
  }
  .connect-steps li::marker { color: #ff6b6b; }

  .steps { counter-reset: step; padding-left: 0; list-style: none; }
  .steps li {
    counter-increment: step;
    background: #faf7ee;
    border-left: 6px solid #ffb703;
    padding: 10px 12px 10px 44px;
    border-radius: var(--radius-md);
    margin-bottom: 8px;
    position: relative;
  }
  .steps li::before {
    content: counter(step);
    position: absolute;
    left: 10px; top: 8px;
    width: 26px; height: 26px;
    background: #ffb703; color: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }

  /* Buttons */
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  button.kid-btn {
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    background: #ff6b6b;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 999px;
    box-shadow: 0 4px 0 #c44a4a;
    transition: transform .1s;
  }
  button.kid-btn:hover { transform: translateY(-2px); }
  button.kid-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c44a4a; }
  button.kid-btn.alt { background: #4cc9f0; box-shadow: 0 4px 0 #2f9bc1; }
  button.kid-btn.warn { background: #ffb703; color: #1c2541; box-shadow: 0 4px 0 #b8830a; }

  .safety {
    background: #fff3cd;
    border-left: 8px solid #ff6b6b;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    margin-top: 14px;
  }
  .safety strong { color: #c44a4a; }

  footer.foot { text-align: center; margin-top: 30px; color: var(--ink-soft); }

  /* Energy bolt animation */
  @keyframes float-up { 0% { transform: translateY(10px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }
  .bolt { position: absolute; font-size: 18px; pointer-events: none; animation: float-up 2.4s infinite; }

  /* Spinner */
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .spin-slow { animation: spin 4s linear infinite; transform-origin: center; }
  .spin-fast { animation: spin 1.2s linear infinite; transform-origin: center; }

  /* Pulse */
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; }

  /* Bubble */
  @keyframes bubble { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
  .bubble { animation: bubble 2.2s ease-in infinite; }

  /* Sway */
  @keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .sway { animation: sway 2.4s ease-in-out infinite; transform-origin: bottom center; }

  /* Flicker */
  @keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  .flicker { animation: flicker 1.4s ease-in-out infinite; }

  /* Steam */
  @keyframes steam { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: 0.8; } 100% { transform: translateY(-30px); opacity: 0; } }
  .steam { animation: steam 2.6s ease-out infinite; }

  /* Slide highlight */
  .live-tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    background: #ef476f;
    color: white;
    font-size: 0.75rem;
    margin-left: 8px;
    animation: blink 1.4s infinite ease-in-out;
  }

  @media (max-width: 640px) {
    .energy-flow { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const formatReading = (v, unit) => v.toFixed(unit === 'mV' ? 0 : 2);

const STATIONS = [
  {
    id: 'solar',
    name: 'Sun Power Station',
    emoji: '☀️',
    cls: 'solar',
    from: 'Light',
    to: 'Electricity',
    sensor: 'Solar panel + MCP3008 channel 0',
    unit: 'V',
    range: [0.2, 4.8],
    color: '#ffb703',
    blurb: 'A solar panel catches sunlight and pushes tiny electrons through wires. The Pi reads the voltage and shows how bright the day is!',
    examples: [
      { title: 'Solar Farm', why: 'Big fields of panels power whole towns.', anim: 'SolarFarm' },
      { title: 'Garden Light', why: 'Charges by day, glows at night.',        anim: 'GardenLight' },
      { title: 'Calculator',  why: 'A tiny panel runs the screen and chips.', anim: 'Calculator' },
    ],
  },
  {
    id: 'wind',
    name: 'Wind Power Station',
    emoji: '💨',
    cls: 'wind',
    from: 'Motion',
    to: 'Electricity',
    sensor: 'Small DC motor (generator) + MCP3008 channel 1',
    unit: 'V',
    range: [0.0, 3.6],
    color: '#56cfe1',
    blurb: 'Spinning blades turn a motor backwards — it becomes a tiny generator. Faster spinning = more electricity!',
    examples: [
      { title: 'Wind Turbine',  why: 'Giant blades spin a generator on a hill.', anim: 'WindTurbine' },
      { title: 'Hydro Dam',     why: 'Falling water spins turbines under a dam.', anim: 'HydroDam' },
      { title: 'Crank Torch',   why: 'Cranking a handle lights up the bulb.',     anim: 'CrankTorch' },
    ],
  },
  {
    id: 'heat',
    name: 'Heat Power Station',
    emoji: '🔥',
    cls: 'heat',
    from: 'Heat',
    to: 'Electricity',
    sensor: 'Peltier (TEC1-12706) + MCP3008 channel 2',
    unit: 'mV',
    range: [10, 850],
    color: '#ff6b6b',
    blurb: 'A Peltier tile makes electricity when one side is warm and the other is cool. Even a warm hand can power an LED!',
    examples: [
      { title: 'Power Plant',   why: 'Heat makes steam, steam spins turbines.', anim: 'PowerPlant' },
      { title: 'Geothermal',    why: 'Earth heat warms water deep underground.', anim: 'Geothermal' },
      { title: 'Body Heat Watch',why:'Tiny watches charge from your warm wrist.', anim: 'BodyHeat' },
    ],
  },
  {
    id: 'lemon',
    name: 'Lemon Power Station',
    emoji: '🍋',
    cls: 'lemon',
    from: 'Chemical',
    to: 'Electricity',
    sensor: 'Lemon battery (Zn + Cu) + MCP3008 channel 3',
    unit: 'V',
    range: [0.5, 1.1],
    color: '#9ec96a',
    blurb: 'Lemon juice + a zinc nail + a copper coin = a soft chemical battery. Electrons take a juicy shortcut through the wire!',
    examples: [
      { title: 'Phone Battery', why: 'Lithium chemistry powers your phone.',   anim: 'PhoneBattery' },
      { title: 'Car Battery',   why: 'Big lead-acid battery starts the engine.',anim: 'CarBattery' },
      { title: 'Toy AA Battery',why: 'Two AAs spin the motor in a toy car.',    anim: 'ToyAA' },
    ],
  },
];

function useLiveReadings() {
  const [readings, setReadings] = useState(() =>
    Object.fromEntries(STATIONS.map(s => [s.id, (s.range[0] + s.range[1]) / 2]))
  );
  const [source, setSource] = useState('sim');

  useEffect(() => {
    let cancelled = false;
    let timer = null;

    const simStep = () => {
      if (cancelled) return;
      setReadings(prev => {
        const next = { ...prev };
        STATIONS.forEach(s => {
          const [lo, hi] = s.range;
          const mid = (lo + hi) / 2;
          const wobble = (Math.random() - 0.5) * (hi - lo) * 0.18;
          const pulled = prev[s.id] + (mid - prev[s.id]) * 0.04 + wobble;
          next[s.id] = clamp(pulled, lo, hi);
        });
        return next;
      });
      timer = setTimeout(simStep, 700);
    };

    const apiStep = async () => {
      if (cancelled) return;
      try {
        const r = await fetch('/api/readings', { cache: 'no-store' });
        if (!r.ok) throw new Error('http ' + r.status);
        const j = await r.json();
        if (cancelled) return;
        setReadings(prev => {
          const next = { ...prev };
          STATIONS.forEach(s => {
            if (typeof j[s.id] === 'number') next[s.id] = j[s.id];
          });
          return next;
        });
        setSource(j.source === 'spi' ? 'pi' : 'sim');
        timer = setTimeout(apiStep, 500);
      } catch {
        if (cancelled) return;
        setSource('sim');
        simStep();
      }
    };

    fetch('/api/readings', { cache: 'no-store' })
      .then(r => {
        if (cancelled) return;
        if (r.ok) apiStep();
        else simStep();
      })
      .catch(() => { if (!cancelled) simStep(); });

    return () => { cancelled = true; clearTimeout(timer); };
  }, []);

  return { readings, source };
}

function Bolt({ left, delay }) {
  return <span className="bolt" style={{ left: left + '%', animationDelay: delay + 's' }}>⚡</span>;
}

function RingGauge({ value, min, max, color, unit, size = 110 }) {
  const pct = clamp((value - min) / (max - min), 0, 1);
  const r = (size - 14) / 2;
  const c = 2 * Math.PI * r;
  const dash = c * pct;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} stroke="rgba(255,255,255,0.18)" strokeWidth="10" fill="none" />
      <circle
        cx={size/2} cy={size/2} r={r}
        stroke={color} strokeWidth="10" fill="none"
        strokeLinecap="round"
        strokeDasharray={`${dash} ${c}`}
        transform={`rotate(-90 ${size/2} ${size/2})`}
        style={{ transition: 'stroke-dasharray 0.7s ease' }}
      />
      <text x="50%" y="46%" textAnchor="middle" fill="#fff" fontSize="18" fontWeight="bold">
        {formatReading(value, unit)}
      </text>
      <text x="50%" y="62%" textAnchor="middle" fill="rgba(255,255,255,0.75)" fontSize="11">{unit}</text>
    </svg>
  );
}

          <line x1="40" y1="42" x2="40" y2="50" />
          <line x1="18" y1="28" x2="26" y2="28" />
          <line x1="54" y1="28" x2="62" y2="28" />
        </g>
      </g>
      {[80,120,160].map((x,i)=>(
        <g key={i}>
          <polygon points={`${x},80 ${x+30},80 ${x+34},60 ${x+4},60`} fill="#274690" />
          <line x1={x+8} y1="63" x2={x+8} y2="78" stroke="#fff" strokeWidth="1" />
          <line x1={x+18} y1="63" x2={x+18} y2="78" stroke="#fff" strokeWidth="1" />
          <line x1={x+28} y1="63" x2={x+28} y2="78" stroke="#fff" strokeWidth="1" />
        </g>
      ))}
    </svg>
  ),
  GardenLight: () => (
    <svg viewBox="0 0 200 110">
      <rect x="0" y="90" width="200" height="20" fill="#5a8f3a" />
      <rect x="95" y="50" width="10" height="40" fill="#666" />
      <polygon points="80,50 120,50 110,30 90,30" fill="#274690" />
      <circle className="flicker" cx="100" cy="62" r="6" fill="#ffe066" />
      <circle cx="30" cy="80" r="6" fill="#7bc36a" />
      <circle cx="170" cy="80" r="6" fill="#7bc36a" />
    </svg>
  ),
  Calculator: () => (
    <svg viewBox="0 0 200 110">
      <rect x="50" y="15" width="100" height="85" rx="8" fill="#333" />
      <rect x="58" y="22" width="84" height="20" fill="#9ee493" />
      <text x="138" y="37" textAnchor="end" fontFamily="monospace" fill="#1c2541" fontSize="14">
        <tspan className="flicker">2+2=4</tspan>
      </text>
      <rect x="58" y="46" width="22" height="6" rx="2" fill="#274690" />
      {[0,1,2,3].map(r => [0,1,2].map(c => (
        <rect key={r+'-'+c} x={60 + c*28} y={56 + r*10} width="22" height="6" rx="2" fill="#ddd" />
      )))}
    </svg>
  ),
  WindTurbine: () => (
    <svg viewBox="0 0 200 110">
      <rect x="0" y="95" width="200" height="15" fill="#a7e08b" />

function StationCard({ station, value }) {
  const [lo, hi] = station.range;
  const pct = clamp((value - lo) / (hi - lo), 0, 1) * 100;
  return (
    <div className={`station ${station.cls}`}>
      <Bolt left={10} delay={0} />
      <Bolt left={70} delay={0.7} />
      <Bolt left={45} delay={1.4} />
      <h3><span className="emoji">{station.emoji}</span>{station.name}</h3>
      <div style={{ fontSize: '0.9rem', opacity: 0.8 }}>
        {station.from} ➜ {station.to}
      </div>
      <div className="what">{station.blurb}</div>
      <div style={{ fontSize: '0.85rem', opacity: 0.8 }}>Sensor: {station.sensor}</div>
      <div className="reading">
        {formatReading(value, station.unit)} <span className="unit">{station.unit}</span>
      </div>
      <div className="bar"><span style={{ width: pct + '%' }} /></div>
    </div>
  );
}

function PresentationSlide({ readings, source }) {
  const totalPct = useMemo(() => {
    const parts = STATIONS.map(s => {
      const [lo, hi] = s.range;
      return clamp((readings[s.id] - lo) / (hi - lo), 0, 1);
    });
    return parts.reduce((a,b) => a+b, 0) / parts.length;
  }, [readings]);

  return (
    <div className="slide">
      <h2>Live Energy Dashboard <span className="live-tag">{source === 'pi' ? 'LIVE · Pi' : 'LIVE · sim'}</span></h2>
      <p style={{ marginTop: 0, opacity: 0.85 }}>
        {source === 'pi'
          ? 'Pi Zero 2 W is reading the four stations through the MCP3008 every half second.'
          : 'Showing simulated values — open this page through the Pi server to see real station readings.'}
      </p>

      <div className="pi">
        <span className="dot" aria-label="online" />
        <strong style={{ color: source === 'pi' ? '#06d6a0' : '#ffd166' }}>
          {source === 'pi' ? 'raspberry-pi-zero-2 online' : 'simulation mode'}
        </strong>
        <span style={{ opacity: 0.8 }}>· MCP3008 ADC · SPI bus</span>
        <span style={{ marginLeft: 'auto', background: 'rgba(255,255,255,0.08)', padding: '4px 10px', borderRadius: 999 }}>
          Total energy mix: {(totalPct * 100).toFixed(0)}%
        </span>
      </div>

      <div className="progress-rings">
        {STATIONS.map(s => (
          <div className="ring-wrap" key={s.id}>
            <RingGauge value={readings[s.id]} min={s.range[0]} max={s.range[1]} color={s.color} unit={s.unit} />
            <div className="name">{s.emoji} {s.name.replace(' Power Station','')}</div>
          </div>
        ))}
      </div>

      <div className="energy-flow">
        {STATIONS.map(s => (
          <div className="flow-cell" key={s.id}>
            <div className="lbl">{s.from}</div>
            <div className="big" style={{ color: s.color }}>
              {formatReading(readings[s.id], s.unit)} {s.unit}
            </div>
            <div className="lbl">➜ {s.to}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

};
const MCP_PIN_NAMES = {
  1:'CH0', 2:'CH1', 3:'CH2', 4:'CH3', 5:'CH4', 6:'CH5', 7:'CH6', 8:'CH7',
  9:'DGND', 10:'CS', 11:'DIN', 12:'DOUT', 13:'CLK', 14:'AGND', 15:'VREF', 16:'VDD',
};
const MCP_LEFT_PINS  = [16, 15, 14, 13, 12, 11, 10, 9];
const MCP_RIGHT_PINS = [1, 2, 3, 4, 5, 6, 7, 8];

function WiringDiagram() {
  const wires = [
    { color: '#e63946', label: 'Red — 3V3 power (Pi pin 1)' },
    { color: '#000',    label: 'Black — Ground (Pi pin 6)' },
    { color: '#ffb703', label: 'Yellow — SPI SCLK (Pi pin 23 / GPIO11)' },
    { color: '#06d6a0', label: 'Green — SPI MISO (Pi pin 21 / GPIO9)' },
    { color: '#4cc9f0', label: 'Blue — SPI MOSI (Pi pin 19 / GPIO10)' },
    { color: '#b5179e', label: 'Purple — SPI CE0 (Pi pin 24 / GPIO8)' },
  ];

  const PIN_X_L = 220, PIN_X_R = 248, PIN_TOP = 96, PIN_DY = 34, PIN_W = 22, PIN_H = 20;
  const pinPos = (n) => {
    const pair = Math.ceil(n / 2);
    const isLeft = n % 2 === 1;
    const x = isLeft ? PIN_X_L : PIN_X_R;
    const y = PIN_TOP + (pair - 1) * PIN_DY;
    return { x, y, cy: y + PIN_H / 2, rightEdge: x + PIN_W };
  };

  const MCP_X = 480, MCP_Y = 150, MCP_W = 140, MCP_H = 320;
  const mcpPos = (n) => {
    const onLeft = n >= 9;
    const order = onLeft ? MCP_LEFT_PINS : MCP_RIGHT_PINS;
    const idx = order.indexOf(n);
    const y = MCP_Y + 30 + idx * ((MCP_H - 60) / 7);
    return { x: onLeft ? MCP_X : MCP_X + MCP_W, y, onLeft };
  };

  const wirePath = (piPin, mcpPin, color) => {
    const p = pinPos(piPin);
    const m = mcpPos(mcpPin);
    const startX = p.rightEdge;
    const midX = (startX + m.x) / 2;
    return (
      <path key={`${piPin}-${mcpPin}`}
        d={`M ${startX} ${p.cy} C ${midX} ${p.cy}, ${midX} ${m.y}, ${m.x} ${m.y}`}
        stroke={color} strokeWidth="2.5" fill="none" strokeLinecap="round" />
    );
  };

  const VDDy = mcpPos(16).y;
  const VREFy = mcpPos(15).y;
  const AGNDy = mcpPos(14).y;
  const DGNDy = mcpPos(9).y;

  return (
    <div className="card">
      <h2>🔌 Build It! Wiring Diagram</h2>
      <p>This is the real circuit. The little parts (resistors, diodes and a transistor) are seat-belts that keep too much voltage from reaching the tiny Pi. Ask a grown-up to help, and always unplug the Pi before changing wires.</p>

      <div style={{ background: '#fffbe6', borderLeft: '6px solid #ffb703', borderRadius: 12, padding: '14px 16px', marginBottom: 18 }}>
        <h3 style={{ marginTop: 0 }}>🔍 First — what the MCP3008 chip actually looks like</h3>
        <p style={{ margin: '4px 0 6px' }}>
          The schematic further down is drawn for clear wires — <strong>it does NOT match the chip's physical pin order</strong>. Use this picture to plug each wire into the correct pin on the real chip.
        </p>
        <div style={{ display: 'flex', gap: 18, flexWrap: 'wrap', alignItems: 'flex-start', marginTop: 10 }}>
          <svg viewBox="0 0 240 380" style={{ width: 220, flexShrink: 0, background: '#fff', borderRadius: 8 }}>
            <text x="120" y="20" textAnchor="middle" fontSize="11" fill="#1c2541" fontWeight="bold">notch / dot at top</text>
            <path d="M 108 34 Q 120 46 132 34" fill="none" stroke="#1c2541" strokeWidth="2" />
            <rect x="62" y="42" width="116" height="324" fill="#1c2541" rx="6" />
            <circle cx="120" cy="48" r="3.5" fill="#fbfaf3" />
            <text x="120" y="212" textAnchor="middle" fontSize="14" fontWeight="bold" fill="#fff">MCP3008</text>
            {Array.from({ length: 8 }).map((_, i) => {
              const y = 72 + i * 36;
              const left = i + 1;
              const right = 16 - i;
              const lname = ['CH0','CH1','CH2','CH3','CH4','CH5','CH6','CH7'][i];
              const rname = ['VDD','VREF','AGND','CLK','DOUT','DIN','CS','DGND'][i];
              return (
                <g key={i}>
                  <rect x="50" y={y - 3} width="12" height="6" fill="#aaa" />
                  <text x="46" y={y + 3} textAnchor="end" fontSize="10" fill="#1c2541" fontWeight="bold">{lname}</text>
                  <text x="68" y={y + 3} fontSize="9" fill="#fff" fontWeight="bold">{left}</text>
                  <rect x="178" y={y - 3} width="12" height="6" fill="#aaa" />
                  <text x="194" y={y + 3} fontSize="10" fill="#1c2541" fontWeight="bold">{rname}</text>
                  <text x="172" y={y + 3} textAnchor="end" fontSize="9" fill="#fff" fontWeight="bold">{right}</text>
                </g>
              );
            })}
          </svg>
          <div style={{ flex: 1, minWidth: 240 }}>
            <p style={{ margin: '0 0 8px' }}><strong>Hold the chip with the notch (the half-moon or dot) at the top.</strong></p>
            <ul style={{ margin: '0 0 8px 18px' }}>
              <li><strong>Left side</strong> = CH0–CH7. The four <em>stations</em> wire in here:<br/>
                  Sun → CH0 (pin 1), Wind → CH1 (pin 2), Heat → CH2 (pin 3), Lemon → CH3 (pin 4).</li>
              <li><strong>Right side</strong> = VDD, VREF, AGND, CLK, DOUT, DIN, CS, DGND. The six wires from the <em>Pi</em> wire in here, plus the two short jumpers (pin 16↔15 and pin 9↔14).</li>
            </ul>
            <p style={{ fontSize: '0.9rem', color: 'var(--ink-soft)', margin: 0 }}>
              If all four channels read 0 on the dashboard, the most common cause is that the Pi wires went into the chip's <em>left</em> side instead of the right.
            </p>
          </div>
        </div>
      </div>

      <h3>Pi GPIO header ↔ MCP3008 connections (schematic — see physical pinout above)</h3>
      <svg viewBox="0 0 760 820" style={{ width: '100%', height: 'auto', background: '#fbfaf3', borderRadius: 18 }}>
        {/* Pi board background */}
        <rect x="20" y="60" width="190" height="750" rx="14" fill="#0f5132" />
        <text x="115" y="84" textAnchor="middle" fontSize="13" fontWeight="bold" fill="#fff">Raspberry Pi Zero 2 W</text>
        <rect x="40" y="100" width="80" height="58" fill="#222" />
        <text x="80" y="133" textAnchor="middle" fill="#fff" fontSize="11">BCM2710</text>
        <rect x="40" y="170" width="50" height="32" fill="#444" />
        <text x="65" y="190" textAnchor="middle" fill="#fff" fontSize="9">SD card</text>
        <rect x="135" y="770" width="60" height="22" rx="3" fill="#222" />
        <text x="165" y="785" textAnchor="middle" fontSize="9" fill="#fff">micro-USB</text>
        <text x={PIN_X_L - 14} y={PIN_TOP - 6} fontSize="9" fill="#ffd166" fontWeight="bold">↓ pin 1 (corner near SD)</text>
        <text x="115" y="800" textAnchor="middle" fontSize="9" fill="#ffd166" fontStyle="italic">all 40 GPIO pins shown</text>

        {/* Wires drawn first so pin squares sit on top */}
        {wirePath(1, 16, '#e63946')}
        {/* VDD → VREF jumper inside chip side */}
        <g>
          <circle cx={MCP_X - 18} cy={VDDy} r="3" fill="#e63946" />
          <path d={`M ${MCP_X} ${VDDy} L ${MCP_X - 18} ${VDDy} L ${MCP_X - 18} ${VREFy} L ${MCP_X} ${VREFy}`}
            stroke="#e63946" strokeWidth="2.5" fill="none" />
        </g>
        {wirePath(6, 9, '#000')}
        {/* DGND → AGND jumper */}
        <g>
          <circle cx={MCP_X - 32} cy={DGNDy} r="3" fill="#000" />
          <path d={`M ${MCP_X} ${DGNDy} L ${MCP_X - 32} ${DGNDy} L ${MCP_X - 32} ${AGNDy} L ${MCP_X} ${AGNDy}`}
            stroke="#000" strokeWidth="2.5" fill="none" />
        </g>
        {wirePath(23, 13, '#ffb703')}
        {wirePath(21, 12, '#06d6a0')}
        {wirePath(19, 11, '#4cc9f0')}
        {wirePath(24, 10, '#b5179e')}

        {/* MCP3008 chip body */}
        <rect x={MCP_X} y={MCP_Y} width={MCP_W} height={MCP_H} rx="6" fill="#1c2541" />
        <text x={MCP_X + MCP_W/2} y={MCP_Y + 18} textAnchor="middle" fontSize="13" fontWeight="bold" fill="#fff">MCP3008</text>
        <text x={MCP_X + MCP_W/2} y={MCP_Y + 34} textAnchor="middle" fontSize="9" fill="#aaa">8-ch SPI ADC</text>
        <circle cx={MCP_X + MCP_W/2} cy={MCP_Y + 3} r="5" fill="#fbfaf3" />
        <text x={MCP_X + MCP_W/2 + 10} y={MCP_Y + 6} fontSize="8" fill="#fbfaf3">notch = top</text>

        {/* MCP pins on left side (power + SPI), top to bottom: 16,15,14,13,12,11,10,9 */}
        {MCP_LEFT_PINS.map(pin => {
          const p = mcpPos(pin);
          return (
            <g key={`L${pin}`}>
              <rect x={p.x - 12} y={p.y - 3} width="12" height="6" fill="#cfd8e3" />
              <text x={p.x - 16} y={p.y + 3} textAnchor="end" fontSize="9" fill="#1c2541" fontWeight="bold">{pin}</text>
              <text x={p.x + 6} y={p.y + 3} fontSize="9" fill="#fff" fontWeight="bold">{MCP_PIN_NAMES[pin]}</text>
            </g>
          );
        })}
        {/* MCP pins on right side (CH0-CH7), top to bottom */}
        {MCP_RIGHT_PINS.map(pin => {
          const p = mcpPos(pin);
          return (
            <g key={`R${pin}`}>
              <rect x={p.x} y={p.y - 3} width="12" height="6" fill="#cfd8e3" />
              <text x={p.x + 16} y={p.y + 3} fontSize="9" fill="#1c2541" fontWeight="bold">{pin}</text>
              <text x={p.x - 6} y={p.y + 3} textAnchor="end" fontSize="9" fill="#fff" fontWeight="bold">{MCP_PIN_NAMES[pin]}</text>
            </g>
          );
        })}

        {/* Station signal arrows on right side of MCP into CH0-CH3 */}
        {[
          { ch: 1, emoji: '☀️', name: 'Sun signal in' },
          { ch: 2, emoji: '💨', name: 'Wind signal in' },
          { ch: 3, emoji: '🔥', name: 'Heat signal in' },
          { ch: 4, emoji: '🍋', name: 'Lemon signal in' },
        ].map(s => {
          const c = mcpPos(s.ch);
          return (
            <g key={s.ch}>
              <line x1={c.x + 30} y1={c.y} x2={c.x + 110} y2={c.y} stroke="#1c2541" strokeWidth="2" />
              <polygon points={`${c.x + 30},${c.y - 5} ${c.x + 30},${c.y + 5} ${c.x + 20},${c.y}`} fill="#1c2541" />

      <h3>Build it in 11 simple steps</h3>

        <li>Switch off the Pi and unplug the power cable. Safety first!</li>
        <li>Plug the MCP3008 into the middle of the breadboard so its legs straddle the gap. The notch (or dot) marks pin&nbsp;1.</li>
        <li><strong>Power:</strong> <em>red</em> wire from Pi <strong>pin 1</strong> (3V3) to MCP <strong>pin 16</strong> (VDD); add a short jumper from MCP pin 16 to MCP <strong>pin 15</strong> (VREF).</li>
        <li><strong>Ground:</strong> <em>black</em> wire from Pi <strong>pin 6</strong> (GND) to MCP <strong>pin 9</strong> (DGND); short jumper from pin 9 to MCP <strong>pin 14</strong> (AGND).</li>
        <li><strong>SPI:</strong> <em>yellow</em> Pi <strong>pin 23</strong> (SCLK/GPIO11) → MCP <strong>pin 13</strong> (CLK); <em>green</em> Pi <strong>pin 21</strong> (MISO/GPIO9) → MCP <strong>pin 12</strong> (DOUT); <em>blue</em> Pi <strong>pin 19</strong> (MOSI/GPIO10) → MCP <strong>pin 11</strong> (DIN); <em>purple</em> Pi <strong>pin 24</strong> (CE0/GPIO8) → MCP <strong>pin 10</strong> (CS).</li>
        <li>Build the <strong>Sun</strong> circuit on the breadboard: panel + → R1 (22kΩ) → junction. From the junction: R2 (10kΩ) to GND, and D1 (1N5817, stripe pointing toward chip) to MCP <strong>pin 1</strong> (CH0). Panel − to GND.</li>
        <li>Build the <strong>Wind</strong> circuit: motor + → D2 (1N4148) → R3 (22kΩ) → tap. From the tap: R4 (10kΩ) to GND, and a wire to MCP <strong>pin 2</strong> (CH1). Motor − to GND.</li>
        <li>Build the <strong>Heat</strong> circuit: Peltier + → D3 (1N4148) → R5 (10kΩ) → Q1 base. Q1 emitter → GND. Q1 collector → R6 (1kΩ) → 3V3 rail. From the collector: a wire to MCP <strong>pin 3</strong> (CH2). Peltier − to GND. (2N3904 pin order with flat side facing you is E-B-C.)</li>
        <li>Build the <strong>Lemon</strong> circuit: copper coin → D4 (1N4148) → MCP <strong>pin 4</strong> (CH3). Zinc nail → GND.</li>
        <li>Double-check every part letter (R1, D1, Q1…) against the diagram before powering on.</li>
        <li>
          Plug the Pi back in and start the server. Two options:
          <ul style={{ marginTop: 6 }}>
            <li><strong>Easy — Pi makes its own Wi-Fi:</strong> run <code>sudo bash pi/setup-hotspot.sh</code> once. The Pi will broadcast a Wi-Fi network called <strong>EnergyDetectives</strong> (password <strong>lightning</strong>). Join it from any device and the dashboard pops up automatically.</li>
            <li><strong>Already on home Wi-Fi:</strong> run <code>python3 pi/energy_detective.py</code> and open <code>http://&lt;pi-ip&gt;:8080</code> from any device on the same Wi-Fi (find the IP with <code>hostname -I</code>).</li>
          </ul>
        </li>
      </ol>

      <div className="safety">
        <strong>Grown-up helper rules:</strong>
        <ul style={{ margin: '6px 0 0 18px' }}>
          <li>Never plug a station <em>directly</em> into a chip channel — always go through its protection circuit.</li>
          <li>Diodes have a stripe on one end (the cathode). The stripe faces toward the chip / away from the source.</li>
          <li>The 2N3904 transistor has a flat side. With the flat side facing you, the pins are <strong>E – B – C</strong>.</li>
          <li>Lemon batteries are safe to touch but don't eat the lemon afterwards.</li>
          <li>The Peltier can get warm — hold the hot side with a coin or metal spoon, not bare fingers.</li>
          <li>Always unplug the Pi before changing wires.</li>
        </ul>
      </div>
    </div>
  );
}

function useWifiInfo() {
  const [info, setInfo] = useState(null);
  useEffect(() => {
    let cancelled = false;
    fetch('/api/wifi', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(j => { if (!cancelled && j) setInfo(j); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);
  return info;
}

              <li>1 × small DC hobby motor with fan blade — the Wind Station</li>
              <li>1 × Peltier tile (TEC1-12706) — the Heat Station</li>
              <li>1 × lemon, 1 zinc-coated nail, 1 copper coin — the Lemon Station</li>
              <li>A grown-up helper and a curious brain! 🧠</li>
            </ul>
          </div>
        </>
      )}

      {tab === 'slide' && (
        <PresentationSlide readings={readings} source={source} />
      )}

      {station && (
        <StationDetail station={station} value={readings[tab]} />
      )}

      {tab === 'wiring' && <WiringDiagram />}

      <footer className="foot">
        Made with ⚡ and ❤️ for curious kids · A Raspberry Pi Zero 2 W STEM project
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
